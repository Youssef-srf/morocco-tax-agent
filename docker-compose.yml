# Local PostgreSQL + pgvector, for development and the database tests:
#   docker compose up -d db
#   docker compose exec db psql -U tax -d morocco_tax -c "CREATE DATABASE morocco_tax_test"
#   uv run --env-file .env pytest -q   # TEST_DATABASE_URL points to morocco_tax_test
# The test database is separate so the tests never overwrite the real index.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tax
      POSTGRES_PASSWORD: tax
      POSTGRES_DB: morocco_tax
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
