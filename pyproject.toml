[project]
name = "morocco-tax-agent"
version = "0.1.0"
description = "Moroccan tax assistant: answers employee income-tax questions citing the exact CGI article, and computes net salary with tested tools"
readme = "README.md"
authors = [
    { name = "Youssef Sarraf", email = "youssefsarraf38@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
morocco-tax-agent = "morocco_tax_agent:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
